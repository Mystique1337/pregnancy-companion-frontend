name: Bootstrap keystore
# One-off: generate a STABLE signing keystore, print its SHA256 fingerprint (for
# assetlinks.json) and base64 (to store as the ANDROID_KEYSTORE_B64 secret).
on:
  workflow_dispatch:

jobs:
  ks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore + print fingerprint & base64
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias bumply \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bumplySigning123 -keypass bumplySigning123 \
            -dname "CN=Bumply, O=Bumply, L=Lagos, C=NG"
          echo "===SHA256_START==="
          keytool -list -v -keystore android.keystore -alias bumply -storepass bumplySigning123 | grep "SHA256:" | head -1
          echo "===SHA256_END==="
          echo "===B64_START==="
          base64 -w0 android.keystore
          echo ""
          echo "===B64_END==="
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: android.keystore
