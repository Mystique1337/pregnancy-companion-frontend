# Optional: deploy via GitHub Actions. The simpler path is Railway's native GitHub
# integration (auto-deploys on push). Use this only if you want Actions-driven deploys.
# To ENABLE: set repo variable DEPLOY_VIA_ACTIONS=true, and secrets RAILWAY_TOKEN
# (a project token) + RAILWAY_SERVICE (service name, e.g. "bumply").
# NOTE: `secrets` can't be used in a job-level `if`; we gate on a repo VARIABLE so the
# workflow cleanly SKIPS (no red X) when auto-deploy isn't configured.
name: Deploy to Railway

on:
  push:
    branches: [dev-shinzii, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_VIA_ACTIONS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - run: railway up --service "${{ secrets.RAILWAY_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
